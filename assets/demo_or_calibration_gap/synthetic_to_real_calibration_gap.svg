<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6FAB"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D9912E"/>
    </marker>
    <style>
      .cn { font-family: 'Microsoft YaHei','Segoe UI',sans-serif; }
      .en { font-family: 'Segoe UI','Arial',sans-serif; }
      .title { font-size: 36px; font-weight: 700; fill: #17324D; }
      .subtitle { font-size: 17px; fill: #607487; }
      .panel-title { font-size: 25px; font-weight: 700; fill: #17324D; }
      .panel-subtitle { font-size: 14px; fill: #607487; letter-spacing: .4px; }
      .box-title { font-size: 18px; font-weight: 700; fill: #17324D; }
      .box-sub { font-size: 13px; fill: #607487; }
      .small { font-size: 14px; fill: #607487; }
      .pill { font-size: 14px; font-weight: 600; fill: #245984; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="70" y="62" class="cn title">模拟到真实的校准缺口</text>
  <text x="70" y="101" class="en subtitle">Synthetic-to-Real Calibration Gap · 代理映射可以接通系统，但不能替代真实模型校准</text>
  <rect x="1250" y="48" width="280" height="38" rx="19" fill="#EDF2F6"/>
  <text x="1390" y="72" text-anchor="middle" class="en small" fill="#245984">REAL API PILOT · CALIBRATION VIEW</text>

  <!-- Left panel -->
  <rect x="70" y="145" width="500" height="455" rx="24" fill="#F2F7FC" stroke="#AFC0CF" stroke-width="1.5"/>
  <circle cx="108" cy="188" r="21" fill="#2F6FAB"/>
  <text x="108" y="195" text-anchor="middle" class="en" font-size="14" font-weight="700" fill="white">01</text>
  <text x="145" y="188" class="cn panel-title">模拟训练侧</text>
  <text x="145" y="214" class="en panel-subtitle">SYNTHETIC TRAINING SIDE</text>

  <rect x="110" y="244" width="420" height="60" rx="12" fill="white" stroke="#AFC0CF"/>
