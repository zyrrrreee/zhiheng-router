  <text x="720" y="368" text-anchor="middle" class="en pill">dev-model-a</text>
  <line x1="795" y1="363" x2="832" y2="363" stroke="#2F6FAB" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="845" y="368" class="en" font-size="14" font-weight="600" fill="#17324D">DeepSeek-v4-Pro</text>
  <rect x="655" y="394" width="130" height="36" rx="18" fill="#E7F1FA"/>
  <text x="720" y="417" text-anchor="middle" class="en pill">dev-model-e</text>
  <line x1="795" y1="412" x2="832" y2="412" stroke="#2F6FAB" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="845" y="417" class="en" font-size="14" font-weight="600" fill="#17324D">DeepSeek-v4-Flash</text>

