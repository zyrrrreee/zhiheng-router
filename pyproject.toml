[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiheng-router"
version = "0.1.0"
description = "Historical-data-based, quality-constrained model routing MVP"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.16.3",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
  "openai==3.8.0",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
