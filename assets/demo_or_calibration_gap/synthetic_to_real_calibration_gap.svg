  <text x="1105" y="214" class="en panel-subtitle">REAL API VALIDATION SIDE</text>

  <rect x="1070" y="250" width="200" height="52" rx="12" fill="#E8F4F4" stroke="#3B8791"/>
  <text x="1170" y="282" text-anchor="middle" class="en box-title" font-size="16">DeepSeek-v4-Pro</text>
  <rect x="1290" y="250" width="200" height="52" rx="12" fill="#E7F1FA" stroke="#2F6FAB"/>
  <text x="1390" y="282" text-anchor="middle" class="en box-title" font-size="16">DeepSeek-v4-Flash</text>
  <line x1="1280" y1="302" x2="1280" y2="325" stroke="#3B8791" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1070" y="330" width="420" height="58" rx="12" fill="white" stroke="#AFC0CF"/>
  <text x="1092" y="357" class="cn box-title">真实模型调用</text>
  <text x="1092" y="378" class="en box-sub">Real API Calls</text>
  <line x1="1280" y1="388" x2="1280" y2="412" stroke="#3B8791" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1070" y="416" width="420" height="145" rx="14" fill="white" stroke="#AFC0CF"/>
  <text x="1092" y="446" class="cn box-title">真实遥测</text>
  <text x="1092" y="468" class="en box-sub">Real Telemetry</text>
  <rect x="1092" y="489" width="86" height="38" rx="19" fill="#EDF2F6"/>
  <text x="1135" y="513" text-anchor="middle" class="en small">Cost</text>
  <rect x="1187" y="489" width="92" height="38" rx="19" fill="#EDF2F6"/>
  <text x="1233" y="513" text-anchor="middle" class="en small">Latency</text>
  <rect x="1288" y="489" width="86" height="38" rx="19" fill="#EDF2F6"/>
  <text x="1331" y="513" text-anchor="middle" class="en small">Tokens</text>
  <rect x="1383" y="489" width="91" height="38" rx="19" fill="#EDF2F6"/>
  <text x="1428" y="513" text-anchor="middle" class="en small">Judge</text>

  <!-- Calibration gap -->
  <line x1="800" y1="450" x2="800" y2="504" stroke="#D9912E" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrowAmber)"/>
  <rect x="620" y="510" width="360" height="210" rx="22" fill="#FFF6E7" stroke="#E7B565" stroke-width="2"/>
  <rect x="650" y="540" width="38" height="38" rx="8" fill="#D9912E"/>
  <text x="669" y="567" text-anchor="middle" class="en" font-size="22" font-weight="700" fill="white">!</text>
  <text x="705" y="557" class="en" font-size="20" font-weight="700" fill="#C95A51">CALIBRATION GAP</text>
  <text x="705" y="581" class="cn" font-size="17" font-weight="700" fill="#17324D">校准缺口</text>
  <circle cx="658" cy="618" r="4" fill="#D9912E"/>
  <text x="674" y="624" class="cn" font-size="16" fill="#17324D">预测质量 ≠ 真实质量</text>
  <circle cx="658" cy="654" r="4" fill="#D9912E"/>
  <text x="674" y="660" class="cn" font-size="16" fill="#17324D">Token / 时延存在波动</text>
  <circle cx="658" cy="690" r="4" fill="#D9912E"/>
  <text x="674" y="696" class="cn" font-size="16" fill="#17324D">真实模型行为分布偏移</text>

  <!-- Next step -->
  <path d="M 980 615 C 1010 615, 1005 720, 1025 720" fill="none" stroke="#2F6FAB" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1030" y="650" width="500" height="160" rx="22" fill="#17324D"/>
  <text x="1060" y="687" class="en" font-size="14" font-weight="700" fill="#9DC7E8">NEXT</text>
  <text x="1060" y="718" class="cn" font-size="22" font-weight="700" fill="white">下一阶段：真实模型校准 + 在线反馈优化</text>
  <rect x="1060" y="744" width="128" height="38" rx="19" fill="#284966"/>
  <text x="1124" y="768" text-anchor="middle" class="cn" font-size="14" fill="white">真实模型校准</text>
  <text x="1202" y="769" class="en" font-size="19" fill="#9DC7E8">→</text>
  <rect x="1220" y="744" width="148" height="38" rx="19" fill="#284966"/>
  <text x="1294" y="768" text-anchor="middle" class="cn" font-size="14" fill="white">阈值 / 概率重校准</text>
  <text x="1382" y="769" class="en" font-size="19" fill="#9DC7E8">→</text>
  <rect x="1400" y="744" width="105" height="38" rx="19" fill="#284966"/>
  <text x="1452" y="768" text-anchor="middle" class="cn" font-size="14" fill="white">在线反馈</text>

  <line x1="70" y1="846" x2="1530" y2="846" stroke="#AFC0CF" stroke-width="1"/>
  <text x="70" y="875" class="cn" font-size="15" fill="#607487">代理映射解决“能接入”，真实校准解决“能可靠决策”。</text>
