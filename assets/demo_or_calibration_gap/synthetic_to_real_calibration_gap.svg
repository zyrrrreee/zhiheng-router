  <rect x="1030" y="145" width="500" height="455" rx="24" fill="#F7FAFD" stroke="#AFC0CF" stroke-width="1.5"/>
  <circle cx="1068" cy="188" r="21" fill="#3B8791"/>
  <text x="1068" y="195" text-anchor="middle" class="en" font-size="14" font-weight="700" fill="white">02</text>
