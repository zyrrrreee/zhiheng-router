  <line x1="320" y1="304" x2="320" y2="326" stroke="#2F6FAB" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="330" width="420" height="60" rx="12" fill="white" stroke="#AFC0CF"/>
  <text x="132" y="357" class="cn box-title">共享特征提取</text>
  <text x="132" y="378" class="en box-sub">Feature Extraction · Query Features</text>
  <line x1="320" y1="390" x2="320" y2="412" stroke="#2F6FAB" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="416" width="420" height="60" rx="12" fill="white" stroke="#AFC0CF"/>
  <text x="132" y="443" class="cn box-title">质量预测器</text>
  <text x="132" y="464" class="en box-sub">Query-aware Predictor · Logistic Regression</text>
  <line x1="320" y1="476" x2="320" y2="496" stroke="#2F6FAB" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="500" width="420" height="72" rx="12" fill="#E7F1FA" stroke="#AFC0CF"/>
  <text x="132" y="521" class="en" font-size="12px" font-weight="700" fill="#607487">PROXY MODEL SPACE</text>
